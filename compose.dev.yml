name: angular-20-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - '4200:4200'
    environment:
      NODE_ENV: development
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4200/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
